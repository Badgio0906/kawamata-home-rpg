name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and web template
        run: |
          curl -L --fail -o godot.zip 'https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -L --fail -o templates.tpz 'https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz'
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -p templates.tpz templates/web_nothreads_release.zip > ~/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip
          unzip -p templates.tpz templates/web_nothreads_debug.zip > ~/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_debug.zip
          unzip -p templates.tpz templates/version.txt > ~/.local/share/godot/export_templates/4.7.2.stable/version.txt
      - name: Export web game
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web web/index.html
          test -s web/index.html
          python3 tools/version_web.py --directory web --version "$GITHUB_SHA"
          touch web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
